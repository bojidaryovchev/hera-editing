- main:
  - navigation "Навигационна пътека":
    - list:
      - listitem:
        - link "Начало":
          - /url: /
      - listitem: Управление на социални мрежи
  - paragraph: Услуга
  - heading "Цялостно управление на социални мрежи за Вашия бизнес" [level=1]
  - paragraph: От първата идея до публикуването — управляваме процеса, така че профилите Ви да бъдат поддържани с реално съдържание от Вашия бизнес.
  - link "Поискайте оферта":
    - /url: /kontakti?from=%2Fupravlenie-na-sotsialni-mrezhi
  - link "Вижте пакетите":
    - /url: /paketi
  - region "Накратко":
    - paragraph: Накратко
    - list:
      - listitem: Стратегия и месечен план
      - listitem: Сценарии
      - listitem: Заснемане на място
      - listitem: Монтаж и субтитри
      - listitem: Публикуване след одобрение
      - listitem: Месечен отчет
  - region "Какво включва поддръжката на фейсбук страница и Instagram":
    - heading "Какво включва поддръжката на фейсбук страница и Instagram" [level=2]
    - paragraph: При нас поддръжката на фейсбук страница обхваща целия процес – от месечния план и заснемането на място в обекта Ви до монтажа, текстовете, публикуването след Вашето одобрение и месечния отчет. По същия начин поддържаме и профилите Ви в Instagram и TikTok, когато са подходящи за бизнеса.
    - list:
      - listitem:
        - heading "Проучване и стратегия" [level=3]
        - paragraph: Разговор за целите, преглед на профилите и конкурентите, 3–4 основни теми за съдържанието и тон на комуникацията.
      - listitem:
        - heading "Месечен календар и сценарии" [level=3]
        - paragraph: Идеи, кратки сценарии и график на публикациите, които одобрявате преди снимките.
      - listitem:
        - heading "Заснемане на място" [level=3]
        - paragraph: Снимачно посещение в уговорения ден, със собствена техника и предварително подготвен списък с кадри.
      - listitem:
        - heading "Монтаж" [level=3]
        - paragraph: Вертикални видеа, обикновено от 15 до 60 секунди, със субтитри, когато са нужни, и версии за избраните платформи.
      - listitem:
        - heading "Текстове към публикациите" [level=3]
        - paragraph: Описания, съобразени с всяка платформа и с тона на бизнеса Ви.
      - listitem:
        - heading "Публикуване" [level=3]
        - paragraph: Насрочване или ръчно публикуване в договорените профили, след Вашето одобрение.
      - listitem:
        - heading "Месечен отчет" [level=3]
        - paragraph: Данни от платформите – обхват, гледания, ангажираност – и запитвания, когато могат да бъдат проследени.
      - listitem:
        - heading "Коментари, по избор" [level=3]
        - paragraph: Наблюдение на коментарите в договорено време, само ако е включено в офертата.
  - region "За кого е подходяща":
    - heading "За кого е подходяща" [level=2]
    - paragraph: За бизнеси, които имат какво да покажат, но нямат време да го снимат и публикуват редовно.
    - paragraph: Например
    - list:
      - listitem: Автосервизи и детайлинг
      - listitem: Фитнес зали, студиа и треньори
      - listitem: Ресторанти, кафенета и хотели
      - listitem: Салони за красота
      - listitem: Магазини, шоуруми и ремонтни услуги
      - listitem: Професионални услуги
    - heading "Подходяща е, ако" [level=3]
    - list:
      - listitem: имате продукти или услуги, които могат да се покажат на видео;
      - listitem: можем да снимаме в обекта Ви по предварителен график;
      - listitem: имате човек, който да одобрява съдържанието;
      - listitem: търсите постоянно присъствие, а не еднократна кампания.
  - region "Първият месец и след това":
    - heading "Първият месец и след това" [level=2]
    - paragraph: Първите месеци служат за настройка и първи изводи от данните. Не обещаваме конкретни резултати.
    - list:
      - listitem:
        - text: Седмици 1–2
        - paragraph: Разговор за целите, преглед на профилите, достъпи, основни теми и график на снимките.
      - listitem:
        - text: Седмици 3–4
        - paragraph: Първо заснемане, монтаж, одобрение и първите публикации.
      - listitem:
        - text: Всеки следващ месец
        - paragraph: Нов календар, снимачно посещение, публикуване и месечен отчет с предложения.
  - region "Как одобрявате съдържанието":
    - heading "Как одобрявате съдържанието" [level=2]
    - paragraph: Публикуваме само след Вашето одобрение.
    - list:
      - listitem: Месечния план и сценариите одобрявате преди снимките.
      - listitem: Готовите видеа одобрявате преди публикуване.
      - listitem: За одобренията определяте едно лице за контакт от Ваша страна.
      - listitem: Обикновено молим за обратна връзка до 7 дни. Ако одобрението закъснее, публикуването се измества съответно.
    - paragraph: Към всяко видео обикновено са включени 2 кръга корекции. Един кръг е един общ списък с Вашите бележки, изпратен наведнъж. Промените в одобрения сценарий след снимките уточняваме отделно в офертата.
    - figure "Примерен месечен календар Пример за начина на работа, не за реален клиент.":
      - text: Примерен месечен календар Пример за начина на работа, не за реален клиент.
      - list:
        - listitem: Публикувано
        - listitem: Одобрено
        - listitem: Чака одобрение
      - list:
        - listitem:
          - text: Седмица 1
          - list:
            - listitem: Вт Как се прави Публикувано
            - listitem: Пт Зад кадър Публикувано
        - listitem:
          - text: Седмица 2
          - list:
            - listitem: Вт Продуктът отблизо Публикувано
            - listitem: Пт Съвет от специалист Публикувано
        - listitem:
          - text: Седмица 3
          - list:
            - listitem: Вт Запознайте се с екипа Одобрено
            - listitem: Пт Как се прави Одобрено
        - listitem:
          - text: Седмица 4
          - list:
            - listitem: Вт Продуктът отблизо Чака одобрение
            - listitem: Пт Зад кадър Чака одобрение
  - region "Какво ще е нужно от Вас":
    - heading "Какво ще е нужно от Вас" [level=2]
    - list:
      - listitem: Лице за контакт, което одобрява плана и видеата.
      - listitem: Достъп до обекта в уговорените дни.
      - listitem: Разрешение за снимане на мястото, продуктите и хората в кадър.
      - listitem: Навременна обратна връзка по плана и готовите видеа.
      - listitem: Достъп до профилите чрез роли за управление. Никога не искаме пароли.
  - region "Платформи и граници на услугата":
    - heading "Платформи и граници на услугата" [level=2]
    - heading "Платформи" [level=3]
    - list:
      - listitem: Facebook 4:5 · 9:16
      - listitem: Instagram 9:16 · 4:5
      - listitem: TikTok 9:16
    - paragraph: Facebook, Instagram и TikTok – според това къде са клиентите Ви. YouTube Shorts – по договаряне.
    - paragraph: Използваме оригинален звук или музика с права за търговска употреба. Популярните песни не могат да се използват в бизнес профили без лиценз.
    - heading "Не е включено" [level=3]
    - list:
      - listitem: Рекламен бюджет и управление на платени кампании
      - listitem: Лични съобщения и обслужване на клиенти
      - listitem: Работа през нощта и в почивни дни
      - listitem: Кризисни комуникации
      - listitem: Сътрудничества с инфлуенсъри и наемане на актьори
      - listitem: Оптимизация на уебсайта за търсачки
      - listitem: Гарантирани продажби, последователи или гледания
  - region "От какво зависи цената":
    - heading "От какво зависи цената" [level=2]
    - paragraph: След кратък разговор изпращаме конкретен обхват и цена.
    - list:
      - listitem: Брой оригинални видеа
      - listitem: Снимачни посещения и локации
      - listitem: Брой платформи
      - listitem: Субтитри, надписи и адаптации
      - listitem: Пътуване извън договорения район
      - listitem: Корекции и модериране на коментари
    - paragraph: Примерен месечен обхват
    - list:
      - listitem: Старт 4 оригинални видеа месечно
      - listitem: Растеж 8 оригинални видеа месечно
      - listitem: Индивидуално Обхват по договаряне, често 12+ видеа
    - paragraph: Примерен обхват; конкретното предложение е индивидуално.
    - link "Вижте пакетите":
      - /url: /paketi
  - region "Често задавани въпроси":
    - heading "Често задавани въпроси" [level=2]
    - group: Трябва ли сами да снимаме?
    - group: Управлявате ли профилите и публикувате ли?
    - group: Работите ли с бизнеси в цялата страна?
    - group: Колко струва?
    - group: Гарантирате ли повече продажби или последователи?
    - group: Трябва ли да се появяваме във видеата?
    - group: Поемате ли рекламния бюджет и съобщенията 24/7?
    - group: Кой одобрява публикациите?
    - group: Кога ще излезе първото видео?
    - group: Колко често идвате да снимате?
    - group: Може ли само в една социална мрежа?
    - group: Колко време ще ни отнеме?
    - group: Не е ли по-добре просто да пуснем реклама?
    - group: Каква музика използвате?
    - group: Ще ни намират ли в Google заради социалните мрежи?
  - region "Нека създадем план за Вашия бизнес.":
    - heading "Нека създадем план за Вашия бизнес." [level=2]
    - paragraph: Разкажете ни къде работите и какво искате да постигнете. Ще предложим обхват и индивидуална цена.
    - link "Поискайте оферта":
      - /url: /kontakti?from=%2Fupravlenie-na-sotsialni-mrezhi
