- main:
  - navigation "Навигационна пътека":
    - list:
      - listitem:
        - link "Начало":
          - /url: /
      - listitem: Политика за поверителност
  - heading "Политика за поверителност" [level=1]
  - paragraph: "Версия: draft-2026-11-18 Чернова. Текстът предстои да бъде одобрен."
  - region "Администратор на данните":
    - heading "Администратор на данните" [level=2]
    - paragraph: "Предстои: Наименование, ЕИК, адрес и контакт на администратора."
  - region "Какви данни събираме":
    - heading "Какви данни събираме" [level=2]
    - paragraph: "Чрез формуляра за запитване: име, фирма или име на бизнеса, град, имейл и/или телефон, сайт или профил в социалните мрежи (по желание), каква цел имате, колко често искате ново съдържание (по желание) и съобщение (по желание). Записваме и страницата, от която е изпратено запитването, и параметрите на рекламна кампания в адреса, ако има такива. Не събираме данни за плащане и не прикачваме файлове."
  - region "За какво ги използваме":
    - heading "За какво ги използваме" [level=2]
    - paragraph: За да отговорим на запитването Ви и да подготвим оферта. Не използваме данните от формуляра за рекламни съобщения.
  - region "Правно основание":
    - heading "Правно основание" [level=2]
    - paragraph: Обработваме данните от запитването, за да предприемем по Ваше искане действия преди сключването на договор (чл. 6, пар. 1, буква „б“ от Общия регламент относно защитата на данните). Когато пишете от името на бизнес, основанието е и законният ни интерес да отговаряме на делови запитвания (буква „е“). Анонимизирания идентификатор за защита от злоупотреби обработваме на основание законния ни интерес да пазим формуляра от автоматизирани заявки (буква „е“). Ако сключим договор, данните, нужни за фактурите, пазим, защото законът го изисква (буква „в“).
    - paragraph: "Предстои: Основанията са предложение, което предстои да бъде одобрено."
  - region "Срок на съхранение":
    - heading "Срок на съхранение" [level=2]
    - paragraph: Запитванията, които не са довели до договор, и кореспонденцията по тях пазим 12 месеца от последния контакт, след което ги изтриваме. Ако сключим договор, пазим данните, докато трае договорът, а след това – толкова, колкото изискват данъчното и счетоводното законодателство.
    - paragraph: "Предстои: Срокът от 12 месеца е предложение, което предстои да бъде одобрено. Дотогава данните не се изтриват автоматично."
  - region "Получатели и обработващи":
    - heading "Получатели и обработващи" [level=2]
    - paragraph: Сайтът се хоства от Vercel, а функциите му работят във Франкфурт, Германия. Запитванията се съхраняват в база данни на Neon, също във Франкфурт. Известията за нови запитвания и отговорите ни се изпращат чрез Resend, в региона му в Европейския съюз. Когато формулярът е защитен с Cloudflare Turnstile, Cloudflare обработва технически данни на браузъра Ви, за да различи хора от автоматизирани програми. Когато някой от тези доставчици обработва данни извън Европейския съюз, например при поддръжка или, при Resend, при обработката на профила в Съединените щати, предаването се основава на стандартните договорни клаузи на Европейската комисия в споразуменията им за обработване на данни. Resend участва и в Рамката за защита на данните между Европейския съюз и Съединените щати.
  - region "Кореспонденция":
    - heading "Кореспонденция" [level=2]
    - paragraph: Когато ни пишете на contact@hera-editing.com или Ви отговаряме на запитване, писмата се съхраняват в базата данни на сайта (Neon, Франкфурт), за да отговаряме от една пощенска кутия, и се пренасят чрез Resend (Европейски съюз). Пазим ги толкова, колкото и запитването, за което се отнасят.
  - region "Защита от злоупотреби":
    - heading "Защита от злоупотреби" [level=2]
    - paragraph: За да ограничим автоматизираните заявки, пазим за кратко време анонимизиран идентификатор, изчислен от IP адреса. Самият IP адрес не се съхранява.
  - region "Вашите права":
    - heading "Вашите права" [level=2]
    - paragraph: Имате право на достъп до данните си, на поправката им, на изтриването им, на ограничаване на обработването, на преносимост и на възражение срещу обработване на основание законен интерес (чл. 15–21 от Общия регламент относно защитата на данните). Можете да подадете жалба до Комисията за защита на личните данни (www.cpdp.bg). За да упражните правата си, пишете ни на адреса за контакт по-долу.
  - region "Контакт по въпроси за поверителност":
    - heading "Контакт по въпроси за поверителност" [level=2]
    - paragraph: "Предстои: Имейл или адрес за запитвания относно личните данни."
