- main:
  - region "Вашият бизнес има какво да покаже. Ние се грижим хората да го видят.":
    - paragraph: Съдържание и управление на социални мрежи за бизнеса
    - heading "Вашият бизнес има какво да покаже. Ние се грижим хората да го видят." [level=1]
    - paragraph: Измисляме съдържанието, идваме да снимаме, монтираме видеата и управляваме публикациите Ви във Facebook, Instagram и TikTok. Всичко по ясен план и с Вашето одобрение.
    - link "Поискайте оферта":
      - /url: /kontakti?from=%2F
    - link "Вижте как работим":
      - /url: "#kak-rabotim"
    - figure "Пример как едно видео минава през снимане, монтаж, надписи и публикуване":
      - paragraph: Примерни стокови кадри · само в тестовата версия
    - complementary "Етапи на видеото":
      - paragraph: Етапи на видеото 01 / 06
      - list:
        - listitem: 01 Суров материал
        - listitem: 02 Монтаж
        - listitem: 03 Цветове
        - listitem: 04 Субтитри
        - listitem: 05 Формат 9:16
        - listitem: 06 Одобрение и публикуване
      - paragraph: "Снимаме при Вас: продуктите, процеса и хората."
      - text: Статус В работа Чака одобрение
  - region "Добрата работа не винаги се вижда онлайн.":
    - heading "Добрата работа не винаги се вижда онлайн." [level=2]
    - 'img "Пример за 12 седмици: без план публикациите излизат нередовно, с месечен план – всяка седмица."'
    - paragraph: Много бизнеси имат интересни продукти, услуги и хора, но нямат време постоянно да измислят, снимат и публикуват съдържание. Организираме този процес вместо Вас, за да изглежда присъствието Ви последователно и професионално.
  - region "Един екип. Целият процес.":
    - heading "Един екип. Целият процес." [level=2]
    - paragraph: Шест етапа, като клипове на една обща линия. Ние и Вие знаем кой какво прави.
    - list:
      - listitem:
        - paragraph: Етап 01
        - heading "Проучваме бизнеса" [level=3]
        - term: Ние
        - definition: Разглеждаме услугите, клиентите и конкурентите Ви.
        - term: Вие
        - definition: Разказвате ни за бизнеса и целите си.
      - listitem:
        - paragraph: Етап 02
        - heading "Планираме съдържанието" [level=3]
        - term: Ние
        - definition: Подготвяме месечен календар с идеи и сценарии.
        - term: Вие
        - definition: Одобрявате плана преди заснемане.
      - listitem:
        - paragraph: Етап 03
        - heading "Идваме и заснемаме" [level=3]
        - term: Ние
        - definition: Идваме със своя техника в уговорения ден.
        - term: Вие
        - definition: Осигурявате достъп и хората, които участват.
      - listitem:
        - paragraph: Етап 04
        - heading "Монтираме и подготвяме" [level=3]
        - term: Ние
        - definition: Монтираме, добавяме субтитри и текстове.
        - term: Вие
        - definition: Преглеждате готовите видеа.
      - listitem:
        - paragraph: Етап 05
        - heading "Публикуваме след одобрение" [level=3]
        - term: Ние
        - definition: Публикуваме по календара в избраните платформи.
        - term: Вие
        - definition: Одобрявате всяка публикация преди това.
      - listitem:
        - paragraph: Етап 06
        - heading "Измерваме и подобряваме" [level=3]
        - term: Ние
        - definition: Изпращаме месечен отчет с предложения.
        - term: Вие
        - definition: Решаваме заедно какво да запазим и какво да сменим.
  - region "Проекти":
    - heading "Проекти" [level=2]
    - paragraph: Видеа, публикувани с разрешение на клиентите.
    - link "Всички проекти":
      - /url: /rabota
    - list:
      - listitem:
        - paragraph: Тестови данни – фиктивен проект
        - paragraph: Вид бизнес Пекарна
        - heading "Тестова пекарна (фиктивни данни)" [level=3]
        - paragraph: "Фиктивен проект за автоматизирани тестове: месечни видеа за витрината и процеса."
        - paragraph: Публикувано с разрешение на клиента
        - link "Вижте проекта – Тестова пекарна (фиктивни данни)":
          - /url: /rabota/testova-pekarna
  - region "Какво може да снимаме при Вас":
    - heading "Какво може да снимаме при Вас" [level=2]
    - paragraph: Кратки вертикални видеа, заснети във Вашия обект. Всяко започва с идея от месечния план и стига до публикуване само след Вашето одобрение.
    - list:
      - listitem:
        - 'button "Пуснете видеото: Как се прави"'
        - heading "Как се прави" [level=3]
        - paragraph: Процесът зад продукта или услугата, показан стъпка по стъпка.
      - listitem:
        - 'button "Пуснете видеото: Зад кадър"'
        - heading "Зад кадър" [level=3]
        - paragraph: Мястото, хората и ежедневието, които клиентите рядко виждат.
      - listitem:
        - 'button "Пуснете видеото: Продуктът отблизо"'
        - heading "Продуктът отблизо" [level=3]
        - paragraph: Детайли, материали и употреба – това, което помага на клиента да избере.
      - listitem:
        - 'button "Пуснете видеото: Съвет от специалист"'
        - heading "Съвет от специалист" [level=3]
        - paragraph: Кратък и полезен съвет от човек от Вашия екип.
      - listitem:
        - 'button "Пуснете видеото: Запознайте се с екипа"'
        - heading "Запознайте се с екипа" [level=3]
        - paragraph: Хората, които стоят зад името на бизнеса.
      - listitem:
        - heading "Вашата идея" [level=3]
        - paragraph: Имате идея за видео? Обсъждаме я при планирането на месеца.
    - paragraph: Примерни стокови кадри · само в тестовата версия. На сайта ще бъдат реални видеа на агенцията.
  - region "Колко съдържание Ви е нужно?":
    - heading "Колко съдържание Ви е нужно?" [level=2]
    - link "Сравнете пакетите":
      - /url: /paketi
    - paragraph: Примерен обхват; конкретното предложение е индивидуално.
    - article "Старт":
      - heading "Старт" [level=3]
      - paragraph: За първо постоянно присъствие
      - paragraph: 4 оригинални видеа месечно
      - list:
        - listitem: 1 снимачно посещение месечно
        - listitem: До 2 платформи по избор
        - listitem: Основен месечен отчет
        - listitem: Публикуване след одобрение
      - paragraph: По индивидуална оферта
      - link "Поискайте оферта":
        - /url: /kontakti?from=%2F&volume=4
    - article "Растеж":
      - heading "Растеж" [level=3]
      - paragraph: За бизнеси със седмична нужда от съдържание
      - paragraph: 8 оригинални видеа месечно
      - list:
        - listitem: 1–2 снимачни посещения месечно
        - listitem: До 3 платформи по избор
        - listitem: Разширен месечен отчет
        - listitem: Публикуване след одобрение
      - paragraph: По индивидуална оферта
      - link "Поискайте оферта":
        - /url: /kontakti?from=%2F&volume=8
    - article "Индивидуално":
      - heading "Индивидуално" [level=3]
      - paragraph: За няколко обекта или по-голяма продукция
      - paragraph: Обхват по договаряне, често 12+ видеа
      - list:
        - listitem: Посещения по договаряне
        - listitem: Платформи по договаряне
        - listitem: Отчет по договаряне
        - listitem: Публикуване след одобрение
      - paragraph: По индивидуална оферта
      - link "Поискайте оферта":
        - /url: /kontakti?from=%2F&volume=12plus
  - region "Често задавани въпроси":
    - heading "Често задавани въпроси" [level=2]
    - link "Повече за услугата":
      - /url: /upravlenie-na-sotsialni-mrezhi
    - group: Трябва ли сами да снимаме?
    - group: Управлявате ли профилите и публикувате ли?
    - group: Колко струва?
    - group: Гарантирате ли повече продажби или последователи?
    - group: Поемате ли рекламния бюджет и съобщенията 24/7?
    - group: Кой одобрява публикациите?
  - region "Нека създадем план за Вашия бизнес.":
    - heading "Нека създадем план за Вашия бизнес." [level=2]
    - paragraph: Разкажете ни къде работите и какво искате да постигнете. Ще предложим обхват и индивидуална цена.
    - link "Поискайте оферта":
      - /url: /kontakti?from=%2F
    - figure "Вашият бизнес · 9:16 · 1080×1920":
      - paragraph: Примерни стокови кадри · само в тестовата версия
      - 'button "Пуснете видеото: Вашият бизнес · 9:16 · 1080×1920"'
      - text: Вашият бизнес · 9:16 · 1080×1920
