  - region "Custom quotes":
    - heading "Custom quotes" [level=2]
    - paragraph: For work no package fits. The quote is in writing and fixed before we start.
    - heading "When we quote" [level=3]
    - list:
      - listitem: Corporate and event work
      - listitem: Motion graphics and animation
      - listitem: Documentaries, and finished videos longer than 20 minutes
      - listitem: Footage or a finished length over a package's limits
      - listitem: Rush jobs
      - listitem: Re-edits of someone else's project, subtitles in several languages or complex music licensing
    - heading "How a quote is built" [level=3]
    - list:
      - listitem: "You describe the job on the order form: the footage, the finished length, the versions and who approves."
      - listitem: We estimate the hours from the footage and the finished minutes, and add 15% for revisions and 10% for admin.
      - listitem: The rate is $45 an hour, or $55 for brands, ads, corporate and motion work. The smallest order is $120.
      - listitem: You get the quote within 1 business day. It is valid for 14 days.
    - link "Ask for a custom quote":
      - /url: /en/order?package=custom&from=%2Fen%2Fpricing
