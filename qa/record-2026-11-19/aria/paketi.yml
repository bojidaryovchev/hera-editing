- main:
  - navigation "Навигационна пътека":
    - list:
      - listitem:
        - link "Начало":
          - /url: /
      - listitem: Пакети
  - paragraph: Пакети
  - heading "Пакети според нуждите на Вашия бизнес" [level=1]
  - paragraph: Няма две еднакви фирми. Можем да започнем с няколко видеа месечно или да изградим по-активен календар. Всяка оферта уточнява посещенията, броя оригинални видеа, платформите, корекциите и публикуването.
  - link "Поискайте оферта":
    - /url: /kontakti?from=%2Fpaketi
  - region "От какво зависи цената":
    - heading "От какво зависи цената" [level=2]
    - paragraph: "Цената на поддръжката на социални мрежи зависи най-вече от броя оригинални видеа и снимачни посещения, от платформите и от това колко управление е нужно. Нямаме общ ценоразпис: след кратък разговор изпращаме конкретен обхват и цена."
    - list:
      - listitem: Брой оригинални видеа
      - listitem: Снимачни посещения и локации
      - listitem: Брой платформи
      - listitem: Субтитри, надписи и адаптации
      - listitem: Пътуване извън договорения район
      - listitem: Корекции и модериране на коментари
  - region "Три примерни нива":
    - heading "Три примерни нива" [level=2]
    - paragraph: Примерен обхват; конкретното предложение е индивидуално.
    - table "Сравнение на пакетите Старт, Растеж и Индивидуално":
      - caption: Сравнение на пакетите Старт, Растеж и Индивидуално
      - rowgroup:
        - row "Старт За първо постоянно присъствие Растеж За бизнеси със седмична нужда от съдържание Индивидуално За няколко обекта или по-голяма продукция":
          - cell
          - columnheader "Старт За първо постоянно присъствие"
          - columnheader "Растеж За бизнеси със седмична нужда от съдържание"
          - columnheader "Индивидуално За няколко обекта или по-голяма продукция"
      - rowgroup:
        - row "Оригинални кратки видеа месечно 4 8 По договаряне, често 12+":
          - rowheader "Оригинални кратки видеа месечно"
          - cell "4"
