  - region "Как броим видеата":
    - heading "Как броим видеата" [level=2]
    - paragraph: Едно оригинално видео е една идея с отделен монтаж. Ако го публикуваме в Instagram, TikTok и Facebook, това е едно видео в три платформи, а не три видеа.
  - region "Често задавани въпроси":
    - heading "Често задавани въпроси" [level=2]
    - link "Повече за услугата":
