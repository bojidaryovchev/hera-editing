    - group: Колко струва?
    - group: За какъв срок е договорът?
    - group: Трябва ли сами да снимаме?
    - group: Трябва ли да се появяваме във видеата?
    - group: Колко корекции са включени?
    - group: Какво съдържа месечният отчет?
    - group: Поемате ли рекламния бюджет и съобщенията 24/7?
    - group: Включено ли е пътуването?
    - group: Чии са профилите и видеата?
    - group: Какво става, ако не сме доволни?
    - group: Кога ще видим резултат?
    - group: Какво става, ако профилът бъде ограничен?
