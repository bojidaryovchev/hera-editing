- main:
  - navigation "Навигационна пътека":
    - list:
      - listitem:
        - link "Начало":
          - /url: /
      - listitem: Бисквитки
  - heading "Бисквитки и настройки" [level=1]
  - paragraph: Тук виждате какво съхраняваме в браузъра Ви и можете да промените избора си по всяко време. Формулярът за запитване работи независимо от избора Ви.
  - paragraph: Чернова. Текстът предстои да бъде прегледан от юрист.
  - region "Необходими":
    - heading "Необходими" [level=2]
    - text: Винаги активни
    - paragraph: Нужни за работата на сайта, например за да запомним избора Ви за бисквитките. Не могат да бъдат изключени.
  - region "Аналитични":
    - heading "Аналитични" [level=2]
    - switch "Аналитични бисквитки"
    - emphasis: Изключени
    - paragraph: Помагат ни да разберем кои страници се посещават, без да събираме данни от формуляра. Включват се само с Вашето съгласие.
  - button "Само необходимите"
  - button "Приемете всички"
  - button "Запазете избора"
  - status
  - region "Какво съхраняваме":
    - heading "Какво съхраняваме" [level=2]
    - table:
      - rowgroup:
        - row "Име За какво е Срок":
          - columnheader "Име"
          - columnheader "За какво е"
          - columnheader "Срок"
      - rowgroup:
        - row "hera_consent Запомня избора Ви за бисквитките. 6 месеца":
          - cell "hera_consent":
            - code: hera_consent
          - cell "Запомня избора Ви за бисквитките."
          - cell "6 месеца"
        - 'row "_ga, _ga_* Google Analytics: различава посещенията, без данни от формуляра. 13 месеца"':
          - cell "_ga, _ga_*":
            - code: _ga, _ga_*
          - 'cell "Google Analytics: различава посещенията, без данни от формуляра."'
          - cell "13 месеца"
